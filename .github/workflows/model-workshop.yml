name: Document reader workshop
on:
  push:
    branches: [codex/model-workshop-parents]
  pull_request:
    branches: [main]
    paths:
      - apps/web/model-workshop/**
      - apps/web/test/model-workshop.test.mjs
      - apps/web/index.html
      - apps/web/app.js
      - apps/web/sw.js
      - tools/review-browser/model-workshop.mjs
      - .github/workflows/model-workshop.yml
permissions:
  contents: read
jobs:
  mobile-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run test:web
      - working-directory: tools/review-browser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/playwright install --with-deps chromium webkit
          node --import tsx --test model-workshop.mjs
