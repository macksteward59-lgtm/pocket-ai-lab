name: Unified model workshop
on:
  push:
    branches: [codex/unified-model-workshop]
  pull_request:
    branches: [main, codex/account-owned-task-recovery]
    paths:
      - apps/web/model-workshop/**
      - apps/web/test/model-workshop.test.mjs
      - apps/web/test/reader-edit.test.mjs
      - apps/web/test/reader-family*.test.mjs
      - apps/web/test/reader-compare.test.mjs
      - apps/web/test/workshop-route.test.mjs
      - apps/web/index.html
      - apps/web/app.js
      - apps/web/sw.js
      - apps/web/server.mjs
      - apps/web/styles.css
      - apps/web/workshop-runtime.mjs
      - scripts/custom-gguf/workshop/**
      - tools/review-browser/*.mjs
      - tools/review-browser/package*.json
      - scripts/custom-gguf/train.py
      - tools/public-source-distillation/student.py
      - .github/workflows/model-workshop.yml
permissions:
  contents: read
jobs:
  mobile-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run test:web
      - working-directory: tools/review-browser
        env:
          READER_COMPARE_EVIDENCE_DIR: ${{ runner.temp }}/reader-compare-evidence
          READER_FAMILY_EVIDENCE_DIR: ${{ runner.temp }}/reader-family-evidence
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/playwright install --with-deps chromium webkit
          node --import tsx --test model-workshop.mjs reader-editor.mjs reader-family.mjs reader-compare.mjs
      - name: Preserve the tested reader families
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reader-family-transfer-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: ${{ runner.temp }}/reader-family-evidence/
      - name: Preserve the passage comparison results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reader-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: ${{ runner.temp }}/reader-compare-evidence/
  host-language-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
      - run: python3 -m pip install transformers==4.55.4 peft==0.17.1 safetensors==0.6.2
      - run: python3 -m unittest discover -s scripts/custom-gguf/workshop
      - run: npm install --no-audit --no-fund
      - working-directory: tools/review-browser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/playwright install --with-deps chromium webkit
          node --import tsx --test host-workshop.mjs
