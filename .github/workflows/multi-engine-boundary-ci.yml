name: Optional ARTEX STRIDE-GPT ExploitGym host-admission contract

on:
  push:
    branches:
      - codex/security-engine-sidecar-contract-v1-20261122
    paths:
      - 'tools/security-evaluation/multi-engine-boundary-v1/**'
      - '.github/workflows/multi-engine-boundary-ci.yml'
  pull_request:
    paths:
      - 'tools/security-evaluation/multi-engine-boundary-v1/**'
      - '.github/workflows/multi-engine-boundary-ci.yml'

permissions:
  contents: read

jobs:
  bounded-host-admission:
    name: Exact snapshot and deny-by-default host-port tests
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout exact proposed commit without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.16.0'
      - name: Run host admission negative controls
        run: |
          node --check tools/security-evaluation/multi-engine-boundary-v1/admission.mjs
          node --test tools/security-evaluation/multi-engine-boundary-v1/admission.test.mjs
      - name: Prove no engine source or external target was required
        run: |
          test ! -d packages/exploitgym
          test -f tools/security-evaluation/multi-engine-boundary-v1/engines.json
