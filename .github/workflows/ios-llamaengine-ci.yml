name: iOS LlamaEngine CI

on:
  pull_request:
    branches:
      - main
      - codex/runtime-proof-verifier-mainline
    paths:
      - "runtime/ios/**"
      - "ios/**"
      - "docs/implementation/ios-llamaengine-gate*.md"
      - "README.md"
      - ".github/workflows/ios-llamaengine-ci.yml"
  push:
    branches:
      - main
      - ios/private-iphone-test-hybrid
    paths:
      - "runtime/ios/**"
      - "ios/**"
      - "docs/implementation/ios-llamaengine-gate*.md"
      - "README.md"
      - ".github/workflows/ios-llamaengine-ci.yml"

permissions:
  contents: read

concurrency:
  group: ios-llamaengine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-llamaengine:
    # macos-15 (arm64) was not acquired: run 42692199700 was cancelled with no steps.
    # The annotation was "The job was not acquired by Runner of type hosted even after
    # multiple attempts" plus the macOS arm64 capacity notice. macos-15-intel is the
    # separate hosted pool. It is an Intel Mac, not an Apple Silicon Mac and not an iPhone.
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          xcodebuild -version
          swift --version
          uname -m

      - name: Install CMake and Ninja
        run: brew install cmake ninja xcodegen

      - name: Build pinned llama.cpp for the simulator and macOS
        run: |
          chmod +x runtime/ios/scripts/build-llama-cpp.sh
          runtime/ios/scripts/build-llama-cpp.sh simulator
          rm -rf runtime/ios/build/cmake-simulator
          runtime/ios/scripts/build-llama-cpp.sh ios-device
          rm -rf runtime/ios/build/cmake-ios-device
          runtime/ios/scripts/build-llama-cpp.sh macos
          rm -rf runtime/ios/build/cmake-macos
          runtime/ios/scripts/build-llama-cpp.sh xcframework
          test -d runtime/ios/build/xc/llama.xcframework
          test -d runtime/ios/build/xc/llama.xcframework/ios-arm64
          find runtime/ios/build/xc/llama.xcframework -maxdepth 1 -type d -name 'ios-*-simulator' | grep -q .
          test -d runtime/ios/build/xc/ggml-metal.xcframework
          test -d runtime/ios/Sources/LlamaCppBridge/vendor

      - name: Typecheck the unlinked fail-closed branch
        run: |
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          xcrun swiftc -typecheck -parse-as-library \
            -target arm64-apple-ios16.0-simulator \
            -sdk "$sdk" \
            runtime/ios/Sources/PocketLlamaEngine/LlamaEngine.swift \
            runtime/ios/Sources/PocketLlamaEngine/LlamaEngineSupport.swift

      - name: Link PocketLlamaEngine for physical iOS device
        working-directory: runtime/ios
        run: |
          set -o pipefail
          # Generic iOS selects iphoneos/arm64. This compiles and links the
          # Swift package and device XCFramework slices; it does not run on a phone.
          xcodebuild build-for-testing \
            -scheme PocketLlamaEngine \
            -destination "generic/platform=iOS" \
            -derivedDataPath /tmp/pocket-derived-device \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/device-build-for-testing.log

      - name: Choose an iPhone simulator
        id: sim
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, subprocess, sys
          raw = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"], text=True)
          devices = json.loads(raw).get("devices", {})
          chosen = None
          for runtime, entries in devices.items():
              if "iOS" not in runtime:
                  continue
              for device in entries:
                  if device.get("isAvailable") and "iPhone" in device.get("name", ""):
                      chosen = device
          if not chosen:
              sys.exit("no available iPhone simulator")
          print(f"id={chosen['udid']}")
          print(f"name={chosen['name']}")
          PY

      - name: Generate and build the native Pocket AI Lab app
        run: |
          rm -rf ios/PocketAILab.xcodeproj
          xcodegen generate --spec ios/project.yml --project ios
          xcodebuild build \
            -project ios/PocketAILab.xcodeproj \
            -scheme PocketAILab \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/pocket-app-derived \
            CODE_SIGNING_ALLOWED=NO
          xcodebuild build \
            -project ios/PocketAILab.xcodeproj \
            -scheme PocketAILab \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/pocket-app-device-derived \
            CODE_SIGNING_ALLOWED=NO

      - name: XCTest the native Pocket AI Lab app
        run: |
          xcodebuild test \
            -project ios/PocketAILab.xcodeproj \
            -scheme PocketAILab \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -derivedDataPath /tmp/pocket-app-test-derived \
            CODE_SIGNING_ALLOWED=YES \\
            CODE_SIGN_IDENTITY=- \\
            CODE_SIGNING_REQUIRED=NO

      - name: XCTest on the iOS simulator
        working-directory: runtime/ios
        run: |
          set -o pipefail
          # Derived data stays outside the package. Writing it under runtime/ios makes
          # xcodebuild decide the package changed and then fail to rewrite its scheme.
          xcodebuild test \
            -scheme PocketLlamaEngine \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -derivedDataPath /tmp/pocket-derived-sim \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/simulator-xctest.log

      - name: Download the pinned smoke GGUF
        run: |
          runtime/ios/scripts/build-llama-cpp.sh fetch-gguf | tee /tmp/gguf-path.txt
          test -s /tmp/gguf-path.txt

      - name: Point the macOS smoke test at that GGUF
        run: runtime/ios/scripts/build-llama-cpp.sh write-smoke-path "$(tail -n 1 /tmp/gguf-path.txt)"

      - name: XCTest on macOS
        run: |
          set -o pipefail
          # swift test rejects the package's linker flag -ObjC. A second xcodebuild in
          # runtime/ios cannot rewrite the scheme generated by the simulator test.
          # A copy of the package is a clean host build of the same XCTest target.
          rm -rf /tmp/pocket-host
          mkdir -p runtime/ios/build
          rsync -a --exclude '.build' --exclude 'build/simulator-xctest.log' runtime/ios/ /tmp/pocket-host/
          cd /tmp/pocket-host
          xcodebuild test \
            -scheme PocketLlamaEngine \
            -destination "platform=macOS,arch=$(uname -m)" \
            -derivedDataPath /tmp/pocket-derived-mac \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$GITHUB_WORKSPACE/runtime/ios/build/macos-xctest.log"
          exit "${PIPESTATUS[0]}"

      - name: Record what this runner actually did
        if: always()
        run: |
          {
            echo "## iOS LlamaEngine CI"
            echo
            echo "This job did not use a physical iPhone."
            echo "Simulator destination: ${{ steps.sim.outputs.name }} (\`${{ steps.sim.outputs.id }}\`)."
            echo
            echo '```'
            grep -h "POCKET_LLAMA_" runtime/ios/build/simulator-xctest.log runtime/ios/build/macos-xctest.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
