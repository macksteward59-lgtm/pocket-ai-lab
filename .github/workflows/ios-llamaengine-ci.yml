name: iOS LlamaEngine CI

on:
  workflow_dispatch:
    inputs:
      package_device_kit:
        description: Build the Xcode kit for personal-device testing
        type: boolean
        default: true
  pull_request:
    branches:
      - main
      - codex/latent-channel-runtime-poc
      - codex/neuralese-sequence-codec-poc
      - codex/gie-canonical-codebook-artifact
      - codex/native-gie1-sequence-encoder
      - codex/gie-native-standalone-smoke-20261120
      - codex/gie-native-capture-integration-20261120
      - codex/native-input-embedding-evaluation-20261120
      - codex/native-recipient-text-benchmark-20261120
      - codex/recipient-format-calibration-20261120
      - codex/native-cloud-analysis-20261120
      - codex/memory-source-preservation
      - codex/source-register-handoff
      - codex/passage-device-server-proof
      - codex/device-resource-samples
    paths:
      - "runtime/ios/**"
      - "packages/intelligence/**"
      - "docs/architecture/GIE-CANONICAL-CODEBOOK-ARTIFACT-v1.md"
      - "ios/**"
      - "tools/evaluation-review/**"
      - "docs/implementation/ios-llamaengine-gate*.md"
      - "README.md"
      - ".github/workflows/ios-llamaengine-ci.yml"
  push:
    branches:
      - main
      - ios/private-iphone-test-hybrid
      - codex/neuralese-sequence-codec-poc
    paths:
      - "runtime/ios/**"
      - "ios/**"
      - "docs/implementation/ios-llamaengine-gate*.md"
      - "README.md"
      - ".github/workflows/ios-llamaengine-ci.yml"

permissions:
  contents: read

concurrency:
  group: ios-llamaengine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-llamaengine:
    # macos-15 (arm64) was not acquired: run 42692199700 was cancelled with no steps.
    # The annotation was "The job was not acquired by Runner of type hosted even after
    # multiple attempts" plus the macOS arm64 capacity notice. macos-15-intel is the
    # separate hosted pool. It is an Intel Mac, not an Apple Silicon Mac and not an iPhone.
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode
        id: toolchain
        run: |
          xcodebuild -version
          swift --version
          uname -m
          echo "xcode_hash=$(xcodebuild -version | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Verify a Swift evaluation export with the independent reader
        run: |
          set -euo pipefail
          sample=$(mktemp -d)
          trap 'rm -rf "$sample"' EXIT
          swiftc -parse-as-library ios/PocketAILab/EvaluationResourceSampler.swift ios/PocketAILab/NativeEvaluationJournal.swift tools/evaluation-review/Smoke.swift -o "$sample/smoke"
          digest=$("$sample/smoke" "$sample")
          python3 tools/evaluation-review/verify.py "$sample/attempt.json" --expected-event-hash "$digest"
          python3 -m unittest discover -s tools/evaluation-review -p 'test_*.py'

      - name: Install CMake and Ninja
        id: build-tools
        run: |
          brew install cmake ninja xcodegen
          tool_versions="$(brew list --versions cmake ninja)"
          echo "build_tools_hash=$(printf '%s\n%s\n' "$(xcodebuild -version)" "$tool_versions" | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Restore pinned llama.cpp build artifacts
        id: llama-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            runtime/ios/build/cache
            runtime/ios/build/src
            runtime/ios/build/simulator
            runtime/ios/build/ios-device
            runtime/ios/build/macos
            runtime/ios/Sources/LlamaCppBridge/vendor
          key: pocket-llama-${{ runner.os }}-${{ runner.arch }}-${{ steps.build-tools.outputs.build_tools_hash }}-${{ hashFiles('runtime/ios/pin/llama-cpp.json', 'runtime/ios/scripts/build-llama-cpp.sh') }}

      - name: Build pinned llama.cpp for the simulator and macOS
        id: llama-build
        run: |
          chmod +x runtime/ios/scripts/build-llama-cpp.sh
          if [[ "${{ steps.llama-cache.outputs.cache-hit }}" == "true" ]] && runtime/ios/scripts/build-llama-cpp.sh verify && runtime/ios/scripts/build-llama-cpp.sh verify-artifacts; then
            echo "Reusing checksum-keyed llama.cpp archives for this pinned source and Xcode toolchain."
          else
            runtime/ios/scripts/build-llama-cpp.sh simulator
            rm -rf runtime/ios/build/cmake-simulator
            runtime/ios/scripts/build-llama-cpp.sh ios-device
            rm -rf runtime/ios/build/cmake-ios-device
            runtime/ios/scripts/build-llama-cpp.sh macos
            rm -rf runtime/ios/build/cmake-macos
          fi
          runtime/ios/scripts/build-llama-cpp.sh verify-artifacts
          runtime/ios/scripts/build-llama-cpp.sh xcframework
          test -d runtime/ios/build/xc/llama.xcframework
          test -d runtime/ios/build/xc/llama.xcframework/ios-arm64
          find runtime/ios/build/xc/llama.xcframework -maxdepth 1 -type d -name 'ios-*-simulator' | grep -q .
          test -d runtime/ios/build/xc/ggml-metal.xcframework
          test -d runtime/ios/Sources/LlamaCppBridge/vendor

      - name: Verify native generation drains queued decode work
        run: |
          bash runtime/ios/scripts/test-native-bridge-drain.sh \
            runtime/ios/Sources/LlamaCppBridge/vendor

      - name: Save verified pinned llama.cpp build cache
        if: always() && steps.llama-cache.outputs.cache-hit != 'true' && steps.llama-build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            runtime/ios/build/cache
            runtime/ios/build/src
            runtime/ios/build/simulator
            runtime/ios/build/ios-device
            runtime/ios/build/macos
            runtime/ios/Sources/LlamaCppBridge/vendor
          key: ${{ steps.llama-cache.outputs.cache-primary-key }}

      - name: Typecheck the unlinked fail-closed branch
        run: |
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          sources=()
          for source in runtime/ios/Sources/PocketLlamaEngine/*.swift; do
            # This metadata parser unconditionally imports the C bridge. The
            # linked package builds below validate it; all other sources stay
            # in the unlinked check as optional engine protocols gain types.
            [[ "$source" == */GGUFMetadata.swift ]] || sources+=("$source")
          done
          xcrun swiftc -typecheck -parse-as-library \
            -target arm64-apple-ios16.0-simulator \
            -sdk "$sdk" \
            "${sources[@]}"

      - name: Link PocketLlamaEngine for physical iOS device
        working-directory: runtime/ios
        run: |
          set -o pipefail
          # Generic iOS selects iphoneos/arm64. This compiles and links the
          # Swift package and device XCFramework slices; it does not run on a phone.
          xcodebuild build-for-testing \
            -scheme PocketLlamaEngine \
            -destination "generic/platform=iOS" \
            -derivedDataPath /tmp/pocket-derived-device \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/device-build-for-testing.log

      - name: Download the pinned smoke GGUF
        run: |
          runtime/ios/scripts/build-llama-cpp.sh fetch-gguf | tee /tmp/gguf-path.txt
          test -s /tmp/gguf-path.txt

      - name: Point the macOS smoke test at that GGUF
        run: |
          # Keep the required host-model path out of the later simulator builds.
          # Only this isolated package copy may configure the real GGUF tests.
          rm -rf /tmp/pocket-host
          mkdir -p runtime/ios/build
          rsync -a --exclude '.build' --exclude 'build/simulator-xctest.log' runtime/ios/ /tmp/pocket-host/
          /tmp/pocket-host/scripts/build-llama-cpp.sh write-smoke-path "$(tail -n 1 /tmp/gguf-path.txt)"
          git diff --exit-code -- runtime/ios/Tests/LlamaEngineTests/SmokePath.swift

      - name: Build macOS tests once
        id: mac-build
        timeout-minutes: 20
        run: |
          set -o pipefail
          # swift test rejects the package's linker flag -ObjC. The prepared
          # package copy also isolates its scheme and required GGUF path from
          # subsequent simulator builds in the original checkout.
          cd /tmp/pocket-host
          xcodebuild build-for-testing \
            -scheme PocketLlamaEngine \
            -destination "platform=macOS,arch=$(uname -m)" \
            -derivedDataPath /tmp/pocket-derived-mac \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$GITHUB_WORKSPACE/runtime/ios/build/macos-build.log"
          # Discover the generated test target instead of assuming SwiftPM's name.
          # Build without filters so the same test product can run in both steps.
          python3 - <<'PY'
          import glob, os, plistlib
          paths = glob.glob('/tmp/pocket-derived-mac/Build/Products/*.xctestrun')
          if len(paths) != 1:
              raise SystemExit(f'Expected one macOS xctestrun, found {paths}')
          with open(paths[0], 'rb') as source:
              plan = plistlib.load(source)
          if 'TestConfigurations' in plan:
              candidates = [target for config in plan['TestConfigurations']
                            for target in config.get('TestTargets', [])]
          else:
              candidates = [dict(value, _identifier=key) for key, value in plan.items()
                            if isinstance(value, dict) and 'TestBundlePath' in value]
          targets = [target for target in candidates
                     if target.get('TestBundlePath', '').endswith('/LlamaEngineTests.xctest')]
          if len(targets) != 1:
              raise SystemExit(f'Expected one LlamaEngineTests target, found {targets}')
          target = targets[0]
          if target.get('OnlyTestIdentifiers') or target.get('SkipTestIdentifiers'):
              raise SystemExit('macOS test product unexpectedly contains test filters')
          identifier = target.get('BlueprintName') or target.get('_identifier')
          if not identifier or '/' in identifier or '\n' in identifier:
              raise SystemExit('Invalid generated test target identifier')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'xctestrun={paths[0]}\ntarget={identifier}\n')
          print(f'Mac test product: {paths[0]}; target: {identifier}')
          PY

      - name: XCTest on macOS
        timeout-minutes: 20
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -xctestrun "${{ steps.mac-build.outputs.xctestrun }}" \
            -destination "platform=macOS,arch=$(uname -m)" \
            -parallel-testing-enabled NO \
            "-skip-testing:${{ steps.mac-build.outputs.target }}/NativeRecipientTextBenchmarkTests" \
            CODE_SIGNING_ALLOWED=NO \
            | tee runtime/ios/build/macos-xctest.log
          exit "${PIPESTATUS[0]}"

      - name: Frozen native text recipient benchmark on macOS
        # A regression in the earlier, separate test process must remain failed
        # while this frozen measurement still records its independent evidence.
        if: ${{ !cancelled() && steps.mac-build.outcome == 'success' }}
        timeout-minutes: 20
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -xctestrun "${{ steps.mac-build.outputs.xctestrun }}" \
            -destination "platform=macOS,arch=$(uname -m)" \
            -parallel-testing-enabled NO \
            "-only-testing:${{ steps.mac-build.outputs.target }}/NativeRecipientTextBenchmarkTests" \
            CODE_SIGNING_ALLOWED=NO \
            | tee runtime/ios/build/native-recipient-text-xctest.log
          exit "${PIPESTATUS[0]}"

      - name: Preserve and independently verify recipient benchmark evidence
        if: always() && steps.mac-build.outcome == 'success'
        run: |
          python3 - <<'PY'
          import hashlib, json, math, os, pathlib, re, uuid
          root = pathlib.Path('runtime/ios')
          log = root / 'build/native-recipient-text-xctest.log'
          destination = root / 'build/native-recipient-text'
          destination.mkdir(parents=True, exist_ok=True)
          records = {'START': [], 'TRIAL': [], 'SUMMARY': []}
          decode_errors = []
          for line in log.read_text(encoding='utf-8', errors='replace').split('\n') if log.exists() else []:
              match = re.search(r'\bPOCKET_RECIPIENT_TEXT_(START|TRIAL|SUMMARY) (\{.*\})\s*$', line)
              if match:
                  try:
                      records[match[1]].append(json.loads(match[2]))
                  except json.JSONDecodeError as error:
                      decode_errors.append(str(error))
          # Save all observed rows before enforcing completion. Timeout/failure
          # evidence must survive even when there is no final summary.
          for kind, values in records.items():
              (destination / f'{kind.lower()}.jsonl').write_text(
                  ''.join(json.dumps(value, sort_keys=True) + '\n' for value in values))
          (destination / 'capture-status.json').write_text(json.dumps({
              'recordCounts': {kind: len(values) for kind, values in records.items()},
              'decodeErrors': decode_errors,
          }, indent=2) + '\n')
          assert not decode_errors, decode_errors
          assert len(records['START']) == len(records['SUMMARY']) == 1, 'Missing/duplicate run metadata'
          assert len(records['TRIAL']) == 36, 'Expected exactly 36 recorded trial rows'
          start, summary = records['START'][0], records['SUMMARY'][0]
          manifest = start['manifestASCII'].encode('ascii')
          (destination / 'manifest.txt').write_bytes(manifest)
          source = (root / 'Sources/PocketLlamaEngine/NativeRecipientTextBenchmark.swift').read_text()
          expected_manifest = re.search(r'expectedManifestSHA256 = "([0-9a-f]{64})"', source)[1]
          assert hashlib.sha256(manifest).hexdigest() == start['manifestSHA256'] == expected_manifest
          pin = json.loads((root / 'pin/smoke-gguf.json').read_text())
          llama_pin = json.loads((root / 'pin/llama-cpp.json').read_text())
          assert start['modelArtifactSHA256'] == pin['sha256']
          assert start['modelId'] == 'sha256-' + pin['sha256']
          assert start['providerKind'] == 'llamaCpp'
          assert start['executionSetting'] == summary['executionSetting'] == 'cpu-requested'
          assert start['offload'] == summary['offload']
          assert start['offload']['requestedGpuLayers'] == 0
          assert start['llamaCppPinCommit'] == llama_pin['commit']
          assert (start['contextLength'], start['maxTokens'], start['temperature'],
                  start['maxOutputBytes'], start['maximumDurationSeconds']) == (512, 4, 0, 128, 900)

          # Decode the canonical length-prefixed manifest, not a second prompt
          # template. This binds every returned trial to its frozen prompt/key/order.
          header = b'PAL-RECIPIENT-TEXT-MANIFEST-1\n'
          assert manifest.startswith(header)
          offset, fields = len(header), []
          while offset < len(manifest):
              end = manifest.index(b'\n', offset)
              name, count = manifest[offset:end].decode('ascii').rsplit(':', 1)
              offset = end + 1
              length = int(count)
              value = manifest[offset:offset + length].decode('ascii')
              assert manifest[offset + length:offset + length + 1] == b'\n'
              fields.append((name, value))
              offset += length + 1
          planned, case_id, trial = [], None, None
          for name, value in fields:
              if name == 'case.id':
                  case_id = value
              elif name == 'trial.ordinal':
                  trial = {'ordinal': int(value), 'caseId': case_id}
              elif name == 'trial.condition':
                  trial['condition'] = value
              elif name == 'trial.expectedAnswer':
                  trial['expectedAnswer'] = value
              elif name == 'trial.prompt':
                  assert len(value.encode('ascii')) <= 512
                  trial['promptSHA256'] = hashlib.sha256(value.encode('ascii')).hexdigest()
                  planned.append(trial)
          assert len(planned) == 36
          assert {name: value for name, value in fields if not name.startswith(('case.', 'trial.'))}['caseCount'] == '12'

          observed = [record['trial'] for record in records['TRIAL']]
          run = summary['run']
          assert run['trials'] == observed, 'Summary and incremental records differ'
          assert run['status'] == 'completed'
          for key in ('suiteID', 'suiteVersion', 'manifestSHA256', 'modelId', 'modelArtifactSHA256', 'providerKind'):
              assert run[key] == start[key], key
          assert (run['suiteID'], run['suiteVersion']) == ('pocket-recipient-private-facts', '1')
          assert run['maximumDurationSeconds'] == 900
          assert isinstance(run['elapsedMilliseconds'], int) and run['elapsedMilliseconds'] >= 0
          request_ids, scored = set(), {}
          invalid_count = 0
          for wrapper, actual, expected in zip(records['TRIAL'], observed, planned):
              assert wrapper['manifestSHA256'] == expected_manifest
              assert wrapper['modelArtifactSHA256'] == pin['sha256']
              for key, value in expected.items():
                  assert actual[key] == value, (key, actual, expected)
              assert actual['status'] == 'completed' and actual['errorMessage'] is None
              request_id = str(uuid.UUID(actual['requestId']))
              assert request_id not in request_ids
              request_ids.add(request_id)
              assert isinstance(actual['rawOutput'], str)
              stripped = actual['rawOutput'].strip(' \t\r\n')
              answer = stripped if stripped in ('A', 'B') else None
              assert actual['parsedAnswer'] == answer
              correct = answer == expected['expectedAnswer']
              assert actual['scoredCorrect'] == correct
              assert isinstance(actual['latencyMilliseconds'], int) and actual['latencyMilliseconds'] >= 0
              invalid_count += answer is None
              scored[(actual['caseId'], actual['condition'])] = correct
          case_ids = sorted({row['caseId'] for row in observed})
          assert len(case_ids) == 12 and len(scored) == 36
          correct_count = sum(scored[(case, 'correct')] for case in case_ids)
          absent_count = sum(scored[(case, 'absent')] for case in case_ids)
          counter_count = sum(scored[(case, 'counterfactual')] for case in case_ids)
          wins = sum(scored[(case, 'correct')] and not scored[(case, 'absent')] for case in case_ids)
          losses = sum(scored[(case, 'absent')] and not scored[(case, 'correct')] for case in case_ids)
          pairs = sum(scored[(case, 'correct')] and scored[(case, 'counterfactual')] for case in case_ids)
          counts = dict(caseCount=12, scheduledTrialCount=36, attemptedTrialCount=36,
                        completedTrialCount=36, generationFailedCount=0, notRunBudgetCount=0,
                        invalidAnswerCount=invalid_count, correctAnswerCount=correct_count,
                        absentAnswerCount=absent_count, counterfactualFollowingCount=counter_count,
                        correctOnlyVsAbsentCount=wins, absentOnlyVsCorrectCount=losses,
                        correctAndCounterfactualPairCount=pairs)
          rates = dict(correctAccuracy=correct_count/12, absentAccuracy=absent_count/12,
                       counterfactualFollowingRate=counter_count/12,
                       correctMinusAbsentAccuracy=(correct_count-absent_count)/12,
                       correctAndCounterfactualPairRate=pairs/12)
          for key, value in counts.items():
              assert run['metrics'][key] == value, key
          for key, value in rates.items():
              assert math.isclose(run['metrics'][key], value, rel_tol=0, abs_tol=1e-12), key
          cleanup = summary['cleanup']
          assert cleanup['leaseReleased'] is True
          assert cleanup['activeLeaseCountBeforeRelease'] == 1
          for key in ('activeUseCountBeforeRelease', 'activeRequestsBeforeRelease', 'waitingRequestsBeforeRelease',
                      'activeLeaseCount', 'activeUseCount', 'reservedMemoryMB', 'activeRequests', 'waitingRequests'):
              assert cleanup[key] == 0, key
          for key in ('loadedModelIDs', 'pendingModelIDs', 'unloadingModelIDs'):
              assert cleanup[key] == [], key
          (destination / 'verified-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('\n## Frozen native text recipient benchmark\n\n')
              output.write('All 36 requests completed; this is an execution gate with no minimum quality score.\n\n')
              output.write(f'Manifest: `{expected_manifest}`. Model: `{pin["sha256"]}`.\n\n')
              output.write(f'CPU-requested offload report: `{json.dumps(start["offload"], sort_keys=True)}`.\n\n')
              output.write('| Measure | Observed |\n| --- | --- |\n')
              for label, value in [('Correct message', f'{correct_count}/12'), ('Absent message', f'{absent_count}/12'),
                                   ('Specific counterfactual following', f'{counter_count}/12'),
                                   ('Correct + counterfactual answer switch', f'{pairs}/12'),
                                   ('Paired correct-only / absent-only', f'{wins} / {losses}'),
                                   ('Invalid outputs', f'{invalid_count}/36'),
                                   ('Runner elapsed milliseconds', run['elapsedMilliseconds'])]:
                  output.write(f'| {label} | {value} |\n')
          print('Verified all 36 frozen trials, their exact provenance, strict parser scores, fixed denominators, and cleanup.')
          PY

      - name: Upload recipient benchmark evidence including partial runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-recipient-text-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime/ios/build/native-recipient-text/
            runtime/ios/build/native-recipient-text-xctest.log
          if-no-files-found: warn
          retention-days: 14

      # Simulator startup is independent of the macOS measurement above.
      # Explicit dependency checks retain iOS coverage after an earlier failure,
      # and no failed step is converted into a passing job.
      - name: Choose an iPhone simulator
        id: sim
        if: ${{ !cancelled() && steps.llama-build.outcome == 'success' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, subprocess, sys
          raw = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"], text=True)
          devices = json.loads(raw).get("devices", {})
          candidates = [
              (runtime, device)
              for runtime, entries in devices.items()
              if "iOS" in runtime
              for device in entries
              if device.get("isAvailable") and "iPhone" in device.get("name", "")
          ]
          if not candidates:
              sys.exit("no available iPhone simulator")
          # Prefer a simulator already booted by the hosted image. Otherwise prefer
          # the newest available iOS runtime/device rather than accidentally selecting
          # an older device whose first-boot migration may be unusually slow.
          def runtime_version(runtime):
              import re
              match = re.search(r"iOS[- ]([0-9.]+)", runtime)
              return tuple(int(part) for part in match.group(1).split(".")) if match else ()
          runtime, chosen = max(
              candidates,
              key=lambda item: (
                  item[1].get("state") == "Booted",
                  runtime_version(item[0]),
                  "SE" not in item[1].get("name", ""),
                  item[1].get("name", "")
              )
          )
          print(f"id={chosen['udid']}")
          print(f"name={chosen['name']}")
          print(f"runtime={runtime}")
          print(f"state={chosen.get('state', 'Unknown')}")
          PY

      - name: Boot selected iPhone simulator
        id: sim-boot
        if: ${{ !cancelled() && steps.sim.outcome == 'success' }}
        timeout-minutes: 12
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import sys
          device_id = "${{ steps.sim.outputs.id }}"
          devices = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "-j"], text=True
          )).get("devices", {})
          state = next(
              (device.get("state") for entries in devices.values()
               for device in entries if device.get("udid") == device_id),
              None
          )
          if state is None:
              sys.exit("selected iPhone simulator disappeared before boot")
          if state != "Booted":
              subprocess.run(["xcrun", "simctl", "boot", device_id], check=True, timeout=90)
          try:
              # Fresh hosted simulator images can spend several minutes migrating
              # LaunchServices on first boot. Allow a bounded ten-minute window.
              subprocess.run(
                  ["xcrun", "simctl", "bootstatus", device_id, "-b"],
                  check=True, timeout=600
              )
          except (subprocess.TimeoutExpired, subprocess.CalledProcessError):
              print("Simulator boot failed or timed out; collecting runner diagnostics.", file=sys.stderr)
              subprocess.run(["xcrun", "simctl", "list", "devices", "available"], check=False)
              subprocess.run(["xcrun", "simctl", "list", "runtimes"], check=False)
              raise
          PY

      - name: Generate and build the native Pocket AI Lab app
        id: app-build
        if: ${{ !cancelled() && steps.llama-build.outcome == 'success' }}
        run: |
          rm -rf ios/PocketAILab.xcodeproj
          xcodegen generate --spec ios/project.yml --project ios
          xcodebuild build \
            -project ios/PocketAILab.xcodeproj \
            -scheme PocketAILab \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/pocket-app-derived \
            CODE_SIGNING_ALLOWED=NO
          xcodebuild build \
            -project ios/PocketAILab.xcodeproj \
            -scheme PocketAILab \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/pocket-app-device-derived \
            CODE_SIGNING_ALLOWED=NO

      - name: Package and independently rebuild the device test kit
        id: device-kit
        if: ${{ !cancelled() && steps.app-build.outcome == 'success' && github.event.repository.private == false && (inputs.package_device_kit == true || github.head_ref == 'codex/passage-device-server-proof' || github.head_ref == 'codex/device-resource-samples' || github.head_ref == 'codex/reviewed-answer-relaunch') }}
        run: bash tools/passage-check/package-device-kit.sh "$RUNNER_TEMP/device-kit"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.device-kit.outcome == 'success' }}
        with:
          name: pocket-ai-lab-device-kit
          path: ${{ runner.temp }}/device-kit/
          retention-days: 7
          if-no-files-found: error

      - name: XCTest the native Pocket AI Lab app
        id: app-xctest
        if: ${{ !cancelled() && steps.sim-boot.outcome == 'success' && steps.app-build.outcome == 'success' }}
        timeout-minutes: 20
        run: |
          xcodebuild test \
            -project ios/PocketAILab.xcodeproj \
            -scheme PocketAILab \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -derivedDataPath /tmp/pocket-app-derived \
            -parallel-testing-enabled NO \
            CODE_SIGN_IDENTITY=-

      - name: Check the simulator Memory vault header
        if: ${{ !cancelled() && (steps.app-xctest.outcome == 'success' || steps.app-xctest.outcome == 'failure') }}
        env:
          SIMULATOR_ID: ${{ steps.sim.outputs.id }}
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess

          container = subprocess.check_output(
              ["xcrun", "simctl", "get_app_container", os.environ["SIMULATOR_ID"], "com.pocketailab.personal", "data"],
              text=True,
          ).strip()
          vault = Path(container) / "Library/Application Support/PocketAILab/Memory/memory.enc"
          if not vault.is_file():
              raise SystemExit("The simulator has no saved Memory vault.")
          with vault.open("rb") as stored:
              if stored.read(8) != b"PALMEM01":
                  raise SystemExit("The simulator vault has an unexpected header.")
          print("The installed app wrote the encrypted Memory vault header.")

      - name: XCTest on the iOS simulator
        if: ${{ !cancelled() && steps.sim-boot.outcome == 'success' }}
        timeout-minutes: 20
        working-directory: runtime/ios
        run: |
          set -o pipefail
          # Derived data stays outside the package. Writing it under runtime/ios makes
          # xcodebuild decide the package changed and then fail to rewrite its scheme.
          xcodebuild test \
            -scheme PocketLlamaEngine \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -derivedDataPath /tmp/pocket-derived-sim \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/simulator-xctest.log

      - name: Record what this runner actually did
        if: always()
        run: |
          {
            echo "## iOS LlamaEngine CI"
            echo
            echo "This job did not use a physical iPhone."
            echo "Simulator destination: ${{ steps.sim.outputs.name }} (\`${{ steps.sim.outputs.id }}\`)."
            echo
            echo '```'
            grep -hE "POCKET_LLAMA_[A-Z_]+ " runtime/ios/build/simulator-xctest.log runtime/ios/build/macos-xctest.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
