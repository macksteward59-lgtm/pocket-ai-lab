name: Intelligence TypeScript Tests

on:
  push:
    branches:
      - codex/typescript-test-runner
  pull_request:
    branches:
      - agent-coordination
    paths:
      - "package.json"
      - "tsconfig.json"
      - "tsconfig.intelligence.json"
      - "packages/intelligence/**"
      - ".github/workflows/intelligence-tests.yml"

permissions:
  contents: read

jobs:
  intelligence:
    name: TypeScript build and intelligence tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Compile TypeScript
        run: npm run build:intelligence
      - name: Run intelligence regression tests
        run: npm test
