name: ProofHunt PostgreSQL migration validation

on:
  pull_request:
    paths:
      - "packages/intelligence/security/proofhunt/**"
      - ".github/workflows/proofhunt-postgres.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: proofhunt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d proofhunt_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Apply ProofHunt migration
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d proofhunt_test \
            -v ON_ERROR_STOP=1 \
            -f packages/intelligence/security/proofhunt/migrations/001_proofhunt_scopeguard.sql
      - name: Verify RLS, exact scope, exclusions, revocation, and immutable job basis
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d proofhunt_test \
            -v ON_ERROR_STOP=1 \
            -f packages/intelligence/security/proofhunt/tests/001_scopeguard_postgres.sql
