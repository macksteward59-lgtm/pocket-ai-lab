name: Governance sidecar CI

on:
  push:
    branches:
      - main
      - "grok/governance-as-review"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  sidecar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-integrator-automator
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the sidecar
        run: python -m pip install -e ".[dev]"
      - name: Run pytest
        run: python -m pytest
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Replay fabricated exports offline
        working-directory: ${{ github.workspace }}
        run: |
          npm install
          npm run test:simulation
