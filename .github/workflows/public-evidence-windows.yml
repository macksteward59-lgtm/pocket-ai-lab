name: Full-paper evidence window comparison
on:
  pull_request:
    paths:
      - "tools/full-paper-distillation/**"
      - "tools/long-document-reader/**"
      - "tools/public-source-distillation/student.py"
      - ".github/workflows/public-evidence-windows.yml"

permissions:
  contents: read

jobs:
  retrieval:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Test candidate boundaries and scoring budgets
        run: python3 -m unittest discover -s tools/full-paper-distillation -p 'test*.py'
      - name: Install pinned CPU inference dependencies
        run: python3 -m pip install --only-binary=:all: numpy==2.2.6 onnxruntime==1.21.1 tokenizers==0.21.1
      - name: Replay the original benchmark and compare both cohorts
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/window-search"
          mkdir "$work"
          source=https://huggingface.co/Xenova/e5-small-v2/resolve/02af79985278377e65c724a76275707cb0333c70
          curl -fsSL --retry 2 --max-time 180 -o "$work/encoder.onnx" "$source/onnx/model_int8.onnx?download=true"
          curl -fsSL --retry 2 --max-time 60 -o "$work/tokenizer.json" "$source/tokenizer.json"
          curl -fsSL --retry 2 --max-time 120 -o "$work/test.tgz" https://qasper-dataset.s3.us-west-2.amazonaws.com/qasper-test-and-evaluator-v0.3.tgz
          (
            cd "$work"
            sha256sum --check - <<'SHA256'
          a458124320862073798888baec39b3bc5ecb0199e4ebe1ee511b505d611d5193  encoder.onnx
          d241a60d5e8f04cc1b2b3e9ef7a4921b27bf526d9f6050ab90f9267a1f9e5c66  tokenizer.json
          SHA256
          )
          python3 tools/full-paper-distillation/retrieval.py --archive "$work/test.tgz" \
            --weights "$work/encoder.onnx" --tokenizer "$work/tokenizer.json" --out "$work/baseline.json"
          python3 tools/full-paper-distillation/retrieval_windows.py --archive "$work/test.tgz" \
            --weights "$work/encoder.onnx" --tokenizer "$work/tokenizer.json" \
            --baseline "$work/baseline.json" --out "$work/windows.json"
          python3 tools/long-document-reader/benchmark.py --archive "$work/test.tgz" --out "$work/reader"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: full-paper-retrieval-comparison
          path: |
            ${{ runner.temp }}/window-search/baseline.json
            ${{ runner.temp }}/window-search/windows.json
            ${{ runner.temp }}/window-search/reader/report.json
          if-no-files-found: warn
          retention-days: 14
