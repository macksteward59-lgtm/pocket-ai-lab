name: Owned tenant workflow fixture CI

on:
  pull_request:
    paths:
      - 'tools/security-fixtures/tenant-workflow-v1/**'
      - '.github/workflows/owned-tenant-fixture-ci.yml'
  push:
    branches:
      - codex/owned-tenant-workflow-fixture-20261122
    paths:
      - 'tools/security-fixtures/tenant-workflow-v1/**'
      - '.github/workflows/owned-tenant-fixture-ci.yml'

permissions:
  contents: read

jobs:
  synthetic-tenant-workflow:
    name: Owned-only loopback tenant regression
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out exact proposed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up frozen Node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.16.0'
      - name: Run synthetic fixture and negative controls
        run: node --test tools/security-fixtures/tenant-workflow-v1/*.test.mjs
      - name: Run bounded loopback demonstration
        run: node tools/security-fixtures/tenant-workflow-v1/run.mjs
      - name: Run intended admin privilege negative control
        run: node tools/security-fixtures/tenant-workflow-v1/admin-control.mjs
