name: Synthetic finding quality benchmark CI

on:
  pull_request:
    paths:
      - 'tools/security-evaluation/heldout-finding-quality-v1/**'
      - '.github/workflows/heldout-finding-quality-ci.yml'
  push:
    branches:
      - codex/heldout-finding-quality-20261122
    paths:
      - 'tools/security-evaluation/heldout-finding-quality-v1/**'
      - '.github/workflows/heldout-finding-quality-ci.yml'

permissions:
  contents: read

jobs:
  synthetic-finding-quality:
    name: Frozen synthetic evidence scoring
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out exact proposed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up frozen Node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.16.0'
      - name: Score predeclared synthetic cases and rejection controls
        run: node --test tools/security-evaluation/heldout-finding-quality-v1/score.test.mjs
      - name: Run scripted baseline quality comparison
        run: node tools/security-evaluation/heldout-finding-quality-v1/run.mjs
