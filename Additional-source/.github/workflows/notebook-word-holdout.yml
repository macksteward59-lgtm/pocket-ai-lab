name: Fresh notebook word-choice evaluation
on:
  pull_request:
    branches: [codex/frozen-word-choice-evaluation]
    paths:
      - tools/word-choice/holdout.py
      - tools/word-choice/compare.py
      - .github/workflows/notebook-word-holdout.yml

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.fresh.outputs.value }}
    steps:
      - id: fresh
        name: Generate a fresh shared case seed after the code is fixed
        run: python3 -c 'import secrets; print("value=" + secrets.token_hex(16))' >> "$GITHUB_OUTPUT"

  notebook:
    needs: seed
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: ubuntu-x64
            digest: 9f4a78cc4e4c9f5a166102a43f1d8f8e4e9d75e76823eb9505d05bbba288abd5
          - os: macos-15-intel
            platform: macos-x64
            digest: 8f243f949097f85823307f1a48fc9ec530e732861568f503c8eaca4c1cf5c6d4
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0
      - name: Verify the existing model and pinned CPU server
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCHIVE_SHA: ${{ matrix.digest }}
          POCKET_GGUF_ID: qwen2.5-0.5b-instruct-q4_k_m
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/evidence"
          mkdir "$results" "$RUNNER_TEMP/llama"
          version=$(jq -r .tag runtime/ios/pin/llama-cpp.json)
          test "$version" = b12233
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o llama.tar.gz "https://github.com/ggml-org/llama.cpp/releases/download/$version/llama-$version-bin-$PLATFORM.tar.gz"
          echo "$ARCHIVE_SHA  llama.tar.gz" | shasum -a 256 --check
          tar -xzf llama.tar.gz -C llama --strip-components=1
          llama/llama-server --version 2>&1 | tee "$results/server-version.txt"
          uname -sm > "$results/host.txt"
          cd "$GITHUB_WORKSPACE"
          git rev-parse HEAD > "$results/source-commit.txt"
          POCKET_GGUF_DIR="$RUNNER_TEMP/models" node scripts/local-gguf/fetch-smoke-gguf.mjs | tee "$results/model-pin.json"
      - name: Measure each reading policy on the same fresh notebook
        shell: bash
        env:
          CASE_SEED: ${{ needs.seed.outputs.value }}
          MODEL: qwen2.5-0.5b-instruct-q4_k_m
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/evidence"
          file=$(jq -er 'select(.verified == true) | .path' "$results/model-pin.json")
          "$RUNNER_TEMP/llama/llama-server" --host 127.0.0.1 --port 18081 \
            -m "$file" --alias "$MODEL" -c 512 -np 1 -ngl 0 > "$RUNNER_TEMP/server.log" 2>&1 &
          pid=$!
          trap 'rc=$?; if ((rc)); then tail -25 "$RUNNER_TEMP/server.log"; fi; kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            kill -0 "$pid"
            if curl --max-time 2 -fs http://127.0.0.1:18081/health >/dev/null; then break; fi
            sleep 1
          done
          curl --max-time 3 -fsS http://127.0.0.1:18081/health | jq -e '.status == "ok"'
          python3 tools/word-choice/holdout.py "$CASE_SEED" "$results"
      - name: Preserve the questions, raw decisions and provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: notebook-evidence-${{ matrix.platform }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 14
