[project]
name = "ai-integrator"
version = "0.1.0"
description = "Non-executing governance review sidecar. Parses scanner exports and returns remediation text."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "pydantic>=2.9,<3",
  "cryptography>=43,<47",
  "defusedxml>=0.7.1,<0.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "httpx>=0.27,<1",
]

[project.scripts]
governance-sidecar = "ai_integrator.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
