name: Consumer prototype CI
on:
  push:
    branches: [main, "codex/consumer-prototype-foundation"]
  pull_request:
    branches: [main, "codex/native-memory-relaunch", "codex/project-source-lookup"]
jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check apps/web/server.mjs
      - run: node --check apps/web/app.js
      - run: node --check apps/web/sw.js
      - run: npm test
      - run: npm run build
      - name: Verify project source search in Chromium and WebKit
        working-directory: tools/review-browser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/playwright install --with-deps chromium webkit
          node --test --test-name-pattern="searches project sources" review.mjs
      - name: Verify source handoff publication and recovery in the Worker runtime
        working-directory: workers/document-analysis
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm test
